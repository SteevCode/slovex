    <!-- Checkmark -->
    <path d="M22 22l4 4 8-8" stroke="#0E9F8E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Wordmark -->
  <text x="58" y="32" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="28" font-weight="700" fill="#0B2545">Solvex</text>
  <text x="170" y="32" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="28" font-weight="300" fill="#0B2545">Report</text>
  <!-- Subtle underline accent -->
