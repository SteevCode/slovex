<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- Logo mark: map-pin with checkmark -->
  <g transform="translate(0, 2)">
    <!-- Pin body -->
    <path d="M28 4C17.5 4 9 12.5 9 23c0 14 19 33 19 33s19-19 19-33C47 12.5 38.5 4 28 4z" fill="#0E9F8E"/>
    <!-- Inner circle -->
