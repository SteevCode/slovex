version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: solvex_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_pass
      MYSQL_DATABASE: solvex_report
      MYSQL_USER: solvex
      MYSQL_PASSWORD: solvex_password
    ports:
      - "3306:3306"
    volumes:
      - solvex_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "solvex", "-psolvex_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solvex_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: solvex_report
      DB_USER: solvex
      DB_PASS: solvex_password
      APP_ENV: local
      ENABLE_DEMO_TOOLS: "true"
      BASE_URL: "http://localhost:8000"
    volumes:
      - ./:/var/www/html
      - solvex_storage:/var/www/html/storage
    command: >
      bash -c "php /var/www/html/scripts/install.php --demo && apache2-foreground"

volumes:
  solvex_db_data:
  solvex_storage:
